<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DASHBOARD MONITORING</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
/* Dashboard Monitoring – MC Mujabeast */

/* ===== Variabel tema & reset ===== */
:root {
  --bg: #000;
  --surface: #0a0e0f;
  --ink: #e9f2f3;
  --mute: #8d9fa2;
  --line: #1f2c2e;
  --soft: #121a1b;
  --good: #3ddc84;
  --goodbg: #10301f;
  --mid: #f5b36b;
  --midbg: #3a2813;
  --bad: #ff5a52;
  --badbg: #431f1d;
  --im3: #f2c230;
  --tri: #f06ab4;
  --teal: #2aa6b4;
  --cyan: #44cbd8;
  --track: #6f7778;
  --lime: #8ffb9f;
  --tosca: #22d3c0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #f1f4f6;
  --surface: #fff;
  --ink: #10202a;
  --mute: #5a6b73;
  --line: #d9e1e5;
  --soft: #e8eef1;
  --good: #146c45;
  --goodbg: #dcf2e6;
  --mid: #9a4d0c;
  --midbg: #fde8d3;
  --bad: #a82b26;
  --badbg: #fadedc;
  --im3: #c99700;
  --tri: #d6408f;
  --teal: #16899a;
  --cyan: #0e7f8d;
  --track: #c3cdd1;
  --lime: #1c7a3b;
  --tosca: #0fae9e;
  color-scheme: light;
}

html {
  scroll-padding-top: env(safe-area-inset-top,0px);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 16px 56px;
}

h1 {
  font-size: clamp(1.5rem,3.2vw,2.2rem);
  line-height: 1.15;
  letter-spacing: -.02em;
  margin: 0 0 4px;
}

h2 {
  font-size: 1.1rem;
  margin: 36px 0 12px;
}

h3 {
  font-size: .95rem;
  margin: 0 0 6px;
}

.mute {
  color: var(--mute);
}

/* Tanggal "INDIKASI KPI ..." di atas judul */
.idate {
  font-weight: 700;
  font-size: .8rem;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 2px;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--tri);
  outline-offset: 2px;
}

/* ===== Tabel, tab, dan komponen umum ===== */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin: 20px 0 4px;
}

.tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 10px 14px;
  font-weight: 500;
  color: var(--mute);
}

.tabs button[aria-selected=true] {
  color: var(--ink);
  border-bottom-color: var(--ink);
  font-weight: 700;
}

.sum {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
  gap: 16px 0;
  margin-top: 24px;
}

.sum>div {
  border-left: 1px solid var(--line);
  padding: 2px 16px;
}

.sum b {
  display: block;
  font-size: 2rem;
  line-height: 1.1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}

.wrap {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-variant-numeric: tabular-nums;
}

th,
td {
  padding: 9px 12px;
  text-align: right;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}

th {
  font-weight: 500;
  color: var(--mute);
  font-size: .85rem;
  background: var(--surface);
}

th.l,
td.l {
  text-align: left;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tfoot td {
  font-weight: 700;
  background: var(--soft);
  border-top: 2px solid var(--line);
  border-bottom: 0;
}

tr.grp th {
  text-align: center;
  color: var(--ink);
  font-weight: 700;
  border-bottom: 1px solid var(--line);
  border-left: 1px solid var(--line);
}

tr.grp th:first-child {
  border-left: 0;
}

.cs th[data-c] {
  cursor: pointer;
}

.pill {
  display: inline-block;
  min-width: 3.6em;
  padding: 1px 8px;
  border-radius: 99px;
  font-weight: 500;
  text-align: center;
}

.good {
  color: var(--good);
  background: var(--goodbg);
}

.mid {
  color: var(--mid);
  background: var(--midbg);
}

.bad {
  color: var(--bad);
  background: var(--badbg);
}

.t-good {
  color: var(--good);
}

.t-bad {
  color: var(--bad);
}

#sc button {
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  line-height: 1.3;
}

#sc tr.on td {
  background: var(--soft);
}

.rows {
  display: grid;
  gap: 12px;
}

.row {
  display: grid;
  grid-template-columns: 130px 1fr 230px;
  gap: 12px;
  align-items: center;
}

.bar {
  position: relative;
  height: 20px;
  background: var(--soft);
  border-radius: 3px;
  display: flex;
}

.bar i {
  display: block;
  height: 100%;
}

.bar i:first-child {
  border-radius: 3px 0 0 3px;
}

.bar .tg {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 2px;
  background: var(--ink);
}

.leg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin: 0 0 14px;
  color: var(--mute);
  font-size: .88rem;
}

.leg s {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: -1px;
  text-decoration: none;
}

.groups {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 24px 32px;
  margin-top: 20px;
}

.groups h3 {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 4px;
}

dl {
  margin: 0;
}

.groups dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 0;
  border-bottom: 1px solid var(--line);
}

dt {
  color: var(--mute);
}

dd {
  margin: 0;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.desc {
  max-width: 70ch;
  margin: 8px 0 0;
}

.ctl {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0 12px;
  align-items: center;
}

.ctl input,
.ctl select {
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}

.ctl input {
  flex: 1 1 220px;
  min-width: 0;
}

.maxh {
  max-height: 70vh;
  overflow: auto;
}

.maxh thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  box-shadow: 0 1px 0 var(--line);
}

footer {
  margin-top: 40px;
  color: var(--mute);
  font-size: .85rem;
  max-width: 80ch;
}

@media (max-width:700px) {
  .row {
    grid-template-columns: 1fr;
  }

  .row .mute {
    order: 3;
  }
}

[hidden] {
  display: none!important;
}

/* ===== Hero, kartu ringkasan, dan ring ===== */
.hero {
  display: grid;
  grid-template-columns: 1.7fr 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.c {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 16px;
  border-radius: 2px;
  min-width: 0;
}

.c.g,
.c.kg {
  background: linear-gradient(135deg,rgba(42,166,180,.22),var(--surface) 55%);
  border-color: #17484f;
}

.c h3 {
  margin: 0 0 8px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--cyan);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.big .v {
  font-size: clamp(1.9rem,3.3vw,2.6rem);
  font-weight: 700;
  line-height: 1.05;
  color: var(--cyan);
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  margin-bottom: 12px;
}

.pb {
  height: 10px;
  border-radius: 5px;
  background: var(--track);
  overflow: hidden;
}

.pb i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg,var(--teal),var(--tri));
  border-radius: 5px;
}

.ok {
  color: var(--lime);
  margin-top: 8px;
  font-weight: 500;
}

/* Kartu KPI: kiri (OSA, Sellin SP) | ring | kanan (Compliance) */
.c.kg {
  display: flex;
  align-items: center;
}

.kpi3 {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: center;
  width: 100%;
}

.kpi3>svg {
  width: 150px;
  height: 150px;
}

.kpi3 dl {
  font-size: .88rem;
}

.kpi3 dl div {
  padding: 3px 0;
  white-space: nowrap;
}

.kpi3 dt {
  display: inline;
  font-weight: 700;
  color: var(--ink);
}

.kpi3 dt::after {
  content: " : ";
}

.kpi3 dd {
  display: inline;
  font-weight: 700;
  color: var(--cyan);
}

.kpi3>div:last-child {
  text-align: right;
}

.kp {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.kp dl {
  flex: 1 1 150px;
}

.kp dl div {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
}

/* Metrik pendukung: gauge setengah lingkaran */
.mini {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 12px;
}

.gauge {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 12px 14px 14px;
  background: linear-gradient(135deg,rgba(42,166,180,.18),var(--surface) 55%);
  border-color: #17484f;
}

.c.gauge h3 {
  margin: 0 0 6px;
  font-size: .85rem;
  font-weight: 700;
  color: var(--ink);
  text-decoration: none;
}

.gauge-svg {
  width: 100%;
  max-width: 170px;
  height: auto;
  overflow: visible;
}

.g-track,
.g-fill {
  fill: none;
  stroke-width: 12;
}

.g-track {
  stroke: var(--track);
}

.g-fill {
  stroke: var(--tosca);
}

.g-text {
  fill: var(--tosca);
  font-size: 15px;
  font-weight: 700;
}

.g-rows {
  margin-top: 6px;
  line-height: 1.55;
  font-size: .88rem;
  font-weight: 500;
}

.g-rows b {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.g-link {
  color: var(--cyan);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.g-rows b.t-bad {
  color: var(--bad);
}

.g-rows b.t-good {
  color: var(--good);
}

.rings {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  gap: 10px;
}

.rings .c {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 14px;
}

.rings svg {
  width: 118px;
  height: 118px;
}

.rings h3 {
  align-self: flex-start;
}

h2.sm {
  font-size: .95rem;
  margin: 28px 0 10px;
  color: var(--mute);
  font-weight: 500;
}

@media (max-width:900px) {
  .hero {
    grid-template-columns: 1fr;
  }
}

/* ===== Warna status: hijau >= 91%, merah di bawahnya, teal jika tidak ada data ===== */
.pb i.is-good {
  background: var(--good);
}

.pb i.is-bad {
  background: var(--bad);
}

.pb i.is-teal {
  background: var(--teal);
}

.ok.is-good {
  color: var(--good);
}

.ok.is-bad {
  color: var(--bad);
}

.ok.is-teal {
  color: var(--teal);
}

/* ===== Ring (donut) SVG ===== */
.ring-track {
  fill: none;
  stroke: var(--track);
  stroke-width: 11;
}

.ring-fill {
  fill: none;
  stroke-width: 11;
}

.ring-fill.is-good {
  stroke: var(--good);
}

.ring-fill.is-bad {
  stroke: var(--bad);
}

.ring-fill.is-teal {
  stroke: var(--teal);
}

/* Khusus Fundamental: isian ring hijau tosca */
.ring-fill.is-tosca {
  stroke: var(--tosca);
}

.ring-text {
  fill: var(--ink);
  font-size: 16px;
  font-weight: 700;
}

.ring-text.is-empty {
  font-size: 20px;
}

.ring-note {
  margin-top: 6px;
  font-size: .8rem;
}

/* ===== Baris gap di bawah kartu OSA / Sellin SP ===== */
.gap-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  padding: 8px 0 0;
  border-top: 1px solid var(--line);
}

.gap-row span {
  color: var(--mute);
}

.gap-row b {
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* ===== Tampilan HP (lebar <= 600px): ukuran dikecilkan agar pas di layar ===== */
@media (max-width:600px) {
  body {
    font-size: 14px;
  }

  main {
    padding: 16px 12px 40px;
  }

  h1 {
    font-size: 1.35rem;
  }

  h2 {
    font-size: 1rem;
    margin: 28px 0 10px;
  }

  h2.sm {
    font-size: .88rem;
    margin: 22px 0 8px;
  }

  .idate {
    font-size: .72rem;
  }

  /* Tab dibagi rata selebar layar */
  .tabs {
    margin-top: 14px;
  }

  .tabs button {
    flex: 1;
    padding: 9px 8px;
    font-size: .9rem;
  }

  /* Kontrol dan filter */
  .ctl {
    gap: 8px;
    margin: 14px 0 10px;
  }

  .ctl select {
    flex: 1 1 140px;
    min-width: 0;
  }

  .ctl input {
    flex: 1 1 100%;
  }

  /* Kartu hero */
  .hero {
    gap: 10px;
    margin-top: 14px;
  }

  .hero .c {
    padding: 14px;
  }

  .c h3 {
    font-size: .82rem;
    margin-bottom: 8px;
  }

  .big .v {
    font-size: 2.1rem;
    margin-bottom: 12px;
  }

  .gap-row {
    margin-top: 12px;
    font-size: .88rem;
  }

  /* Kartu KPI: ring di atas, dua daftar di bawahnya berdampingan */
  .kpi3 {
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    justify-items: stretch;
    text-align: left;
  }

  .kpi3>svg {
    grid-column: 1 / -1;
    order: -1;
    justify-self: center;
    width: 140px;
    height: 140px;
  }

  .kpi3>div:last-child {
    text-align: right;
  }

  .kpi3 dl {
    font-size: .88rem;
  }

  /* Metrik pendukung: 2 kolom, kartu ganjil terakhir selebar penuh */
  .mini {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .mini .gauge {
    padding: 12px 10px 14px;
  }

  .mini .gauge:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  .c.gauge h3 {
    font-size: .8rem;
  }

  .gauge-svg {
    max-width: 150px;
  }

  .g-rows {
    margin-top: 6px;
    font-size: .82rem;
  }

  /* Fundamental: 2 kolom */
  .rings {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .rings .c {
    padding: 12px 10px;
  }

  .rings .c h3 {
    font-size: .78rem;
    margin-bottom: 4px;
  }

  .rings svg {
    width: 100%;
    max-width: 110px;
    height: auto;
  }

  .ring-note {
    font-size: .75rem;
    margin-top: 4px;
  }

  /* Tabel */
  th,
  td {
    padding: 7px 8px;
    font-size: .8rem;
  }

  th {
    font-size: .75rem;
  }

  .pill {
    min-width: 3em;
    padding: 1px 6px;
  }

  .maxh {
    max-height: 65vh;
  }

  footer {
    margin-top: 28px;
    font-size: .78rem;
  }
}
/* ===== TEMPEL DI PALING BAWAH style.css ===== */

/* Compliance: angka saja (tanpa chart) */
.gauge.stat {
  justify-content: center;
}

.stat-v {
  color: var(--tosca);
  font-size: 2.4rem;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

/* Tabel Peringkat DSE: selebar kartu, kolom dibagi rata */
.wrap.fit {
  width: 100%;
}

#sc {
  width: 100%;
  min-width: 560px;
  table-layout: fixed;
}

#sc th:first-child,
#sc td:first-child {
  width: 32%;
}

#sc th,
#sc td {
  text-align: center;
  padding: 10px 12px;
}

#sc th.l,
#sc td.l {
  text-align: left;
  padding-left: 16px;
  white-space: normal;
}

#sc .pill {
  display: block;
  width: 100%;
  max-width: 120px;
  margin: 0 auto;
}
</style>
  </head>
  <body>
    <main>
      <div class="idate" id="date"></div>
      <h1>DASHBOARD MONITORING</h1>
      <div class="tabs" role="tablist">
        <button role="tab" id="t1" aria-selected="true" aria-controls="p1">
          KPI DSE
        </button>
        <button role="tab" id="t2" aria-selected="false" aria-controls="p2">
          Outlet wise
        </button>
      </div>

      <section id="p1" role="tabpanel" aria-labelledby="t1">
        <div class="ctl">
          <label for="ds" class="mute">Tampilkan</label
          ><select id="ds"></select>
        </div>
        <div class="hero">
          <article class="c kg" id="cKpi"></article>
          <article class="c big g" id="cOsa"></article>
          <article class="c big g" id="cSp"></article>
        </div>
        <h2 class="sm">Metrik pendukung</h2>
        <div class="mini" id="mini"></div>
        <h2 class="sm">Fundamental</h2>
        <div class="rings" id="rings"></div>
        <h2>Peringkat DSE berdasarkan KPI</h2>
        <div class="wrap fit"><table id="sc"></table></div>
      </section>
      <section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
        <div class="ctl">
          <input
            id="q"
            type="search"
            placeholder="Cari nama outlet atau ID"
            aria-label="Cari outlet"
          />
          <select id="fd" aria-label="Filter DSE">
            <option value="">MC-MUJABEAST</option>
          </select>
          <span class="mute" id="cnt"></span>
        </div>
        <div class="wrap maxh cs"><table id="ot"></table></div>
      </section>
    </main>
    <script>
// Data dashboard - dibuat otomatis oleh build_data.py dari file Excel
// Jangan edit manual; ubah Excel lalu jalankan ulang build_data.py
const D = {
  date: "2026-10-18",
  dse: [
    {
      nom: 30,
      site: 11,
      id: "MUJABEAST201",
      cso: "TEDY SANJAYA",
      kpi: 0.5604893948463566,
      ci: 0,
      comp: 0.6874358974358974,
      osaT: 309693353,
      osa: 290364500,
      osaGap: -19328853,
      osaIm3: 112833500,
      osa3id: 177531000,
      osaPct: 0.9375871234795278,
      osaKpi: 0.37503484939181114,
      desc: "MUJABEAST201 mencapai 94% OSA dengan realisasi Rp290,36 juta dari target Rp309,69 juta. Masih terdapat gap Rp19,33 juta untuk mencapai target penuh, dengan KPI OSA sebesar 37,5%",
      spT: 330,
      sp: 102,
      spGap: -228,
      spIm3: 92,
      sp3id: 10,
      spPct: 0.3090909090909091,
      spKpi: 0.18545454545454546,
      ecT: 15,
      ec: 10.423076923076923,

    <script>
/* ==========================================================================
   Dashboard Monitoring – MC Mujabeast
   Membutuhkan: data.js (konstanta global D) dimuat lebih dulu
   ========================================================================== */

/* ---------- Helper ---------- */
const $ = s => document.querySelector(s);

// Escape karakter HTML
const E = s =>
  String(s).replace(/[&<>"]/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
  }[c]));

// Format angka (locale Indonesia)
const N = (n, d = 0) =>
  n.toLocaleString('id-ID', { maximumFractionDigits: d, minimumFractionDigits: d });

// Persen
const P = (n, d = 0) => N(n * 100, d) + '%';

// Rupiah dalam juta
const R = n => (n < 0 ? '−' : '') + 'Rp' + N(Math.abs(n) / 1e6, 1) + ' M';

// Juta tanpa "Rp"
const jt = n => N(n / 1e6, 1) + ' M';

// Ambang warna: hijau jika capaian >= 91%, merah di bawahnya
const TARGET = 0.91;

// Warna pill berdasarkan ambang 91%
const tone = v => (v >= TARGET ? 'good' : 'bad');

const pill = (v, d = 0) =>
  v === 0 ? '-' : `<span class="pill ${tone(v)}">${P(v, d)}</span>`;

// Pill berisi angka (teks bebas); warnanya mengikuti persentase pencapaian v
const pillNum = (v, text) =>
  v === 0 ? '-' : `<span class="pill ${tone(v)}">${text}</span>`;

// Jumlah nilai pada key k dari array a
const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);

// Kelas status untuk bar/ring/teks
const fc = v => (v == null ? 'is-teal' : v >= TARGET ? 'is-good' : 'is-bad');

/* ---------- Tanggal ---------- */
$('#date').textContent =
  'INDIKASI KPI ' +
  new Date(D.date).toLocaleDateString('en-GB', {
    day: 'numeric',
    month: 'long',
    year: 'numeric',
    timeZone: 'UTC',
  });

/* ---------- Tabs ---------- */
const TABS = [
  ['t1', 'p1'],
  ['t2', 'p2'],
];

TABS.forEach(([t, p]) => {
  $('#' + t).onclick = () => {
    TABS.forEach(([a, b]) => {
      $('#' + a).setAttribute('aria-selected', a === t);
      $('#' + b).hidden = b !== p;
    });
  };
});

/* ==========================================================================
   TAB 1 – KPI DSE
   ========================================================================== */
const S = [...D.dse].sort((a, b) => b.kpi - a.kpi); // urut KPI tertinggi
let sel = 'all';

// Kolom tabel peringkat: [label, key pencapaian (untuk warna), fungsi angka yang ditampilkan]
const SC = [
  ['KPI', 'kpi', d => P(d.kpi)],
  ['OSA', 'osaPct', d => N(d.osa)],
  ['Sellin SP', 'spPct', d => N(d.sp)],
  ['Retail tagging', 'tgAch', d => N(d.tg)],
];

/* Dropdown "Tampilkan" */
const ds = $('#ds');
ds.add(new Option('MC-MUJABEAST', 'all'));
S.forEach((d, i) => ds.add(new Option(d.id, i)));
ds.onchange = () => {
  sel = ds.value === 'all' ? 'all' : +ds.value;
  draw();
};

/* ---------- Komponen visual ---------- */

// Ring (donut) SVG
const ring = (v, sz, cls = fc(v)) => `
  <svg viewBox="0 0 100 100" width="${sz}" height="${sz}" role="img" aria-label="${v == null ? 'tidak ada data' : P(v, 1)}">
    <circle class="ring-track" cx="50" cy="50" r="40"/>
    <circle class="ring-fill ${cls}" cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="${v == null ? 0 : Math.min(v, 1) * 100} 100" transform="rotate(-90 50 50)"/>
    <text class="ring-text ${v == null ? 'is-empty' : ''}" x="50" y="50" text-anchor="middle" dominant-baseline="central">${v == null ? '–' : P(v, 1)}</text>
  </svg>`.trim();

// Kelas warna untuk gap (negatif = merah, positif = hijau)
const cl = v => (v < 0 ? 't-bad' : v > 0 ? 't-good' : '');

// Kartu besar (OSA / Sellin SP) dengan progress bar dan baris gap
const big = (label, value, ach, gapLabel, gap) => `
  <h3>${label}</h3>
  <div class="v">${value}</div>
  <div class="pb"><i class="${fc(ach)}" style="width:${Math.min(ach, 1) * 100}%"></i></div>
  <div class="ok ${fc(ach)}">${P(ach, 1)} tercapai</div>
  <div class="gap-row"><span>${gapLabel}</span><b class="${cl(gap)}">${gapLabel === 'Gap OSA' ? R(gap) : N(gap)}</b></div>`.trim();

// Gauge setengah lingkaran (isian hijau tosca)
const gaugeSvg = v => `
  <svg class="gauge-svg" viewBox="0 0 100 56" role="img" aria-label="${P(v, 1)}">
    <path class="g-track" d="M10 50 A40 40 0 0 1 90 50" pathLength="100"/>
    <path class="g-fill" d="M10 50 A40 40 0 0 1 90 50" pathLength="100" stroke-dasharray="${Math.min(Math.max(v, 0), 1) * 100} 100"/>
    <text class="g-text" x="50" y="46" text-anchor="middle">${P(v, 1)}</text>
  </svg>`.trim();

// Kartu gauge: judul, gauge, lalu maksimal dua baris keterangan [label, nilai, kelas]
const gauge = (label, v, rows) => `
  <div class="c gauge">
    <h3>${label}</h3>
    ${gaugeSvg(v)}
    <div class="g-rows">${rows.map(([l, val, k]) => `<div>${l} : <b class="${k || ''}">${val}</b></div>`).join('')}</div>
  </div>`.trim();

// Kartu angka saja (tanpa chart)
const stat = (label, value, rows) => `
  <div class="c gauge stat">
    <h3>${label}</h3>
    <div class="stat-v">${value}</div>
    <div class="g-rows">${rows.map(([l, val, k]) => `<div>${l} : <b class="${k || ''}">${val}</b></div>`).join('')}</div>
  </div>`.trim();

// Kartu ring pada bagian "Fundamental" (isian ring selalu hijau tosca)
const ringCard = (label, v, unit) => `
  <div class="c"><h3>${label}</h3>${ring(v, 150, 'is-tosca')}<div class="mute ring-note">${unit}</div></div>`.trim();

/* ---------- Render tab 1 ---------- */
function draw() {
  const A = sel === 'all' ? S : [S[sel]]; // DSE yang ditampilkan
  const s = k => sum(A, k); // total
  const m = k => s(k) / A.length; // rata-rata
  const r = (a, b) => s(a) / s(b); // rasio

  // Hero: KPI (pertama), OSA, Sellin SP
  $('#cKpi').innerHTML = `
    <div class="kpi3">
      <div>
        <h3>KPI - DSE</h3>
        <dl>
          <div><dt>OSA</dt><dd>${P(m('osaKpi'), 0)}</dd></div>
          <div><dt>SELLIN SP</dt><dd>${P(m('spKpi'), 0)}</dd></div>
        </dl>
      </div>
      ${ring(m('kpi'), 170)}
      <div>
        <h3>COMPLIANCE</h3>
        <dl>
          <div><dt>Compl Score</dt><dd>${P(m('comp'), 0)}</dd></div>
          <div><dt>Compl Index</dt><dd>${N(m('ci'), 2)}</dd></div>
        </dl>
      </div>
    </div>`;
  $('#cOsa').innerHTML = big('OSA', jt(s('osa')), r('osa', 'osaT'), 'Gap OSA', s('osaGap'));
  $('#cSp').innerHTML = big('SELLIN SP', N(s('sp')), r('sp', 'spT'), 'Gap Sellin SP', s('spGap'));

  // Metrik pendukung: Compliance (angka saja), Sellin SP RR, Effective Call
  $('#mini').innerHTML = [
    stat('Compliance', P(m('comp'), 1), [['Compl Index', N(m('ci'), 2), 'g-link']]),
    gauge('Sellin SP RR', r('rr', 'rrT'), [
      ['Mtd', N(s('rr')), 'g-link'],
      ['Gap', N(s('rrGap')), cl(s('rrGap'))],
    ]),
    gauge('Effective Call', r('ec', 'ecT'), [
      ['Mtd', N(s('ec'), 1), 'g-link'],
      ['Gap', N(s('ecGap'), 1), cl(s('ecGap'))],
    ]),
  ].join('');

  // Fundamental
  $('#rings').innerHTML = [
    ringCard('RET.TAG', r('tg', 'tgT'), `${N(s('tg'))} dari ${N(s('tgT'))}`),
    ringCard('UAR', r('o3', 'o3T'), `${N(s('o3'))} dari ${N(s('o3T'))}`),
    ringCard('OSA 300K', r('o3', 'o3T'), `${N(s('o3'))} dari ${N(s('o3T'))}`),
    ringCard('PRO OUTLET', r('p', 'pT'), `${N(s('p'))} dari ${N(s('pT'))}`),
    ringCard('SITE LRS', r('lrs', 'lrsT'), `${jt(s('lrs'))} dari ${jt(s('lrsT'))}`),
    ringCard('SITE REVENUE', null, 'Belum ada di Excel'),
  ].join('');

  // Tabel peringkat DSE
  $('#sc').innerHTML =
    '<thead><tr><th class="l">DSE</th>' +
    SC.map(c => `<th>${c[0]}</th>`).join('') +
    '</tr></thead><tbody>' +
    S.map(
      (d, i) =>
        `<tr class="${i === sel ? 'on' : ''}"><td class="l"><button data-i="${i}" aria-pressed="${i === sel}"><b>${E(d.id)}</b><br><span class="mute">${E(d.cso)}</span></button></td>` +
        SC.map(c => `<td>${pillNum(d[c[1]], c[2](d))}</td>`).join('') +
        '</tr>'
    ).join('') +
    '</tbody>';
}

// Klik baris DSE pada tabel peringkat
$('#sc').onclick = e => {
  const b = e.target.closest('button[data-i]');
  if (b) {
    sel = +b.dataset.i;
    ds.value = sel;
    draw();
  }
};

draw();

/* ==========================================================================
   TAB 2 – Outlet wise
   ========================================================================== */
// Buang kolom Site (idx 1) dan PJP (idx 2) dari data
const O = D.outlets.map(r => [r[0], ...r.slice(3)]);

// Definisi kolom: [label, tipe]
// t = teks, r/n = angka, g = gap (merah/hijau), p = persen (pill), s = status OK
const C = [
  ['DSE', 't'], ['Outlet', 't'], ['ID IM3', 't'], ['ID 3ID', 't'],
  ['Target', 'r'], ['MTD', 'r'], ['Gap', 'g'], ['Ach', 'p'], ['IM3', 'r'], ['3ID', 'r'],
  ['Status', 's'], ['Total', 'n'], ['IM3', 'n'], ['3ID', 'n'],
  ['Status', 's'], ['Total', 'n'], ['IM3', 'n'], ['3ID', 'n'],
];

const LEFT = 4; // 4 kolom pertama rata kiri

// Header grup: [judul, jumlah kolom]
const GROUPS = [
  ['Outlet', 4],
  ['OSA', 6],
  ['Sellin SP', 4],
  ['Retail tagging', 4],
];

// State filter dan sort
const st = { q: '', d: '', s: null, dir: 1 };

/* Isi dropdown filter */
[...new Set(O.map(r => r[0]))].sort().forEach(v => $('#fd').add(new Option(v, v)));

/* Event filter dan sort */
$('#q').oninput = e => {
  st.q = e.target.value.toLowerCase();
  outlets();
};
$('#fd').onchange = e => {
  st.d = e.target.value;
  outlets();
};
$('#ot').onclick = e => {
  const h = e.target.closest('th[data-c]');
  if (!h) return;
  const c = +h.dataset.c;
  st.dir = st.s === c ? -st.dir : 1;
  st.s = c;
  outlets();
};

/* Render isi sel sesuai tipe kolom */
const cell = (v, t) =>
  v === 0 && 'rngp'.includes(t)
    ? '<span class="mute">-</span>'
    : t === 't'
    ? E(v)
    : t === 'r'
    ? N(v)
    : t === 'n'
    ? N(v)
    : t === 'g'
    ? `<span class="${v < 0 ? 't-bad' : 't-good'}">${N(v)}</span>`
    : t === 'p'
    ? pill(v, 1)
    : v === 'OK'
    ? '<span class="t-good"><b>OK</b></span>'
    : '<span class="mute">–</span>';

/* Render tabel outlet */
function outlets() {
  // Filter
  let r = O.filter(
    x =>
      (!st.d || x[0] === st.d) &&
      (!st.q || [x[1], x[2], x[3]].join(' ').toLowerCase().includes(st.q))
  );

  // Sort
  if (st.s !== null) {
    r = [...r].sort((a, b) => {
      const x = a[st.s];
      const y = b[st.s];
      return (
        (typeof x === 'number' && typeof y === 'number'
          ? x - y
          : String(x).localeCompare(String(y), 'id', { numeric: true })) * st.dir
      );
    });
  }

  $('#cnt').textContent = `Menampilkan ${N(r.length)} dari ${N(O.length)} outlet`;

  // Baris total (footer)
  const tot = C.map(([, t], i) =>
    t === 't'
      ? ''
      : t === 's'
      ? r.filter(x => x[i] === 'OK').length + ' OK'
      : t === 'p'
      ? ''
      : (q => (q === 0 ? '-' : N(q)))(r.reduce((s, x) => s + x[i], 0))
  );
  const target = r.reduce((s, x) => s + x[4], 0);
  const mtd = r.reduce((s, x) => s + x[5], 0);
  tot[0] = `Total (${N(r.length)} outlet)`;
  tot[7] = target ? pill(mtd / target, 1) : '';

  $('#ot').innerHTML =
    // Header grup
    `<thead><tr class="grp">${GROUPS.map(g => `<th colspan="${g[1]}">${g[0]}</th>`).join('')}</tr><tr>` +
    // Header kolom
    C.map(
      ([l], i) =>
        `<th data-c="${i}" class="${i < LEFT ? 'l' : ''}" aria-sort="${st.s === i ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}">${l}${st.s === i ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`
    ).join('') +
    '</tr></thead><tbody>' +
    // Isi
    r.map(x => '<tr>' + C.map(([, t], i) => `<td class="${i < LEFT ? 'l' : ''}">${cell(x[i], t)}</td>`).join('') + '</tr>').join('') +
    // Footer total
    '</tbody><tfoot><tr>' +
    tot.map((v, i) => `<td class="${i < LEFT ? 'l' : ''}">${v}</td>`).join('') +
    '</tr></tfoot>';
}

outlets();
</script>
